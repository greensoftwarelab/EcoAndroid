plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.3'
}

group 'anaribeiro.ist'

version '1.0.3.1'

sourceCompatibility = 1.8

var intellij_version = "2022.1.1"

intellij {
  version.set(intellij_version)
  plugins.set(['java', 'android'])
  updateSinceUntilBuild.set(false)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
    maven {
        url "https://soot-build.cs.uni-paderborn.de/nexus/repository/soot-release/"
    }
     maven {
        url 'https://www.jetbrains.com/intellij-repository/releases'
    }
    google()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.30'

    implementation 'de.fraunhofer.sit.sse.flowdroid:soot-infoflow-android:2.10'
    implementation 'de.fraunhofer.sit.sse.flowdroid:soot-infoflow:2.10'
    implementation 'org.soot-oss:soot:4.3.0'

    //implementation group: 'de.tud.sse', name: 'soot-infoflow', version: '2.8'
    //implementation 'de.fraunhofer.sit.sse.flowdroid:soot-infoflow-android:2.14.1'
    implementation 'de.fraunhofer.sit.sse.flowdroid:soot-infoflow-cmd:2.10.0'
    implementation group: 'de.upb.cs.swt', name: 'heros', version: '1.1.0'
    implementation name: 'vasco-1.1-SNAPSHOT'
}


task standalone (type: JavaExec, dependsOn: classes){
    if(project.hasProperty('appArgs')){
        args(appArgs.split(','))
    }
    description = "EcoAndroid Resource Leak Standalone"
    main = "leaks.StandaloneRL"
    classpath = sourceSets.main.runtimeClasspath
}


sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
    }
    test {
        java {
            srcDirs = ["src/test/java"]
        }
    }
}


tasks.register('resourceLeakJar', Jar) {
    archiveFileName = "EcoAndroidResourceLeak.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': 'leaks.StandaloneRL'
    }

    from {
        sourceSets.main.output
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}